name: receitas-desafio

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: teste_receitas_rg_sistemas
      MYSQL_USER: recipes
      MYSQL_PASSWORD: ${DB_PASSWORD:-recipes_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-recipes_root_local}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./banco/script.sql:/docker-entrypoint-initdb.d/01-original.sql:ro
      - ./docker/mysql-client.cnf:/etc/mysql/conf.d/client.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: teste_receitas_rg_sistemas
      DB_USER: recipes
      DB_PASSWORD: ${DB_PASSWORD:-recipes_local}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret-32-bytes}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
