services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: teste_receitas_rg_sistemas
      MYSQL_USER: recipes
      MYSQL_PASSWORD: recipes_e2e
      MYSQL_ROOT_PASSWORD: root_e2e
      TZ: UTC
    ports:
      - "127.0.0.1::3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./banco/script.sql:/docker-entrypoint-initdb.d/01-original.sql:ro
      - ./docker/mysql-client.cnf:/etc/mysql/conf.d/client.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s
